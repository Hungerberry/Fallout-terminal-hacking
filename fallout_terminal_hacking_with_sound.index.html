<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wasteland Terminal Hacking</title><style>:root{--green:#77ff8b;--dim:#39894b}*{box-sizing:border-box}body{background:#080f09;color:var(--green);font:16px/1.45 Consolas,'Courier New',monospace;margin:0;padding:24px;text-shadow:0 0 7px #2cff5880}.terminal{max-width:980px;margin:auto;border:2px solid var(--dim);padding:20px;box-shadow:0 0 35px #174b24,inset 0 0 35px #092512;background:repeating-linear-gradient(0deg,#071308,#071308 3px,#09180a 4px)}h1{font-size:1.35rem;margin:0 0 6px}p{margin:6px 0}button,select,input{background:#0c1a0e;border:1px solid var(--dim);color:var(--green);font:inherit;padding:6px;cursor:pointer}button:hover,button:focus{background:#285b32}button:disabled{opacity:.35;cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}.display{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}.line{white-space:nowrap;letter-spacing:.7px}.token{padding:0;border:0;background:none;color:inherit;letter-spacing:inherit}.token:hover{background:var(--green);color:#09120a}.log{min-height:260px;border-left:1px solid var(--dim);padding-left:15px;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:var(--dim)}#status{font-weight:bold}@media(max-width:750px){.display{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;font-size:13px}.terminal{padding:12px}body{padding:8px}.log{border-left:0;border-top:1px solid var(--dim);padding:12px 0;min-height:120px}}</style></head><body><main class="terminal"><h1>ROBCO-STYLE TERMINAL // LOCAL TRAINING SIMULATOR</h1><p>AUTHORIZED PERSONNEL ONLY</p><p id="status">PASSWORD REQUIRED</p><div class="controls"><label>Difficulty <select id="difficulty"><option value="4">Novice (4 letters)</option><option value="6" selected>Average (6 letters)</option><option value="8">Expert (8 letters)</option></select></label><button id="reset">NEW TERMINAL</button><button id="hint">HOW TO PLAY</button><button id="sound" aria-pressed="true">SOUND: ON</button></div><p id="attempts"></p><div class="display"><div class="grid" id="grid"></div><div class="log" id="log" aria-live="polite"></div></div><p class="muted">Click words to guess. Click highlighted matching brackets to remove a dud or restore attempts. Runs entirely offline.</p></main><script>
const bank={4:['COLD','BOLD','HOLD','GOLD','SOLD','FOLD','TOLD','MOLD','WILD','WIND','FIND','MIND','KIND','BIND','BAND','SAND','HAND','LAND','LEND','SEND','BEND','TEND','TENT','DENT','RENT'],6:['PLANET','PLANER','PLATED','PLATES','PLANTS','PLACED','PLAYER','PRAYER','PRIMER','PRICES','BRACES','BRANCH','BRIGHT','BROKEN','GARDEN','GATHER','GENTLE','GROWTH','GROVES','MARKET','MARBLE','MASTER','MATTER','MANNER','MEMORY','MENTAL','METALS','MUTANT','MUTATE','NATURE','NARROW','NEARBY','NEURAL','NUMBER','OBJECT','ORANGE','OUTLAW','OXYGEN','POISON','POWERs'.toUpperCase(),'ROCKET','RANGER','REPAIR','RETURN','ROBOTS','SAFETY','SAVING','SEARCH','SECRET','SECTOR','SHELTER'.slice(0,6),'SIGNAL','SILENT','SISTER','SQUARE','STABLE','STATION'.slice(0,6),'STRONG','SYSTEM','TARGET','TERROR','TRAVEL','TUNNEL','VAULTS','VISION','WEAPON','WONDER'],8:['AUTOMATE','BASELINE','BIOLOGIC','BUILDING','CALIBRATE','CAMPFIRE','CHILDREN','CIRCUITS','COMPUTER','CONFLICT','CREATURE','DATABASE','DEFENDER','DISCOVER','EDUCATOR','ELEVATED','ENGINEER','EQUIPPED','FACILITY','FALLOUTS','FUNCTION','GENERATE','GUARDIAN','HARDWARE','HOSPITAL','IDENTITY','INTEGRAL','KEYBOARD','LANGUAGE','LEARNING','LOCATION','MACHINES','MAINTAIN','MEMORIES','MUTATION','NETWORKS','OVERLOAD','PASSWORD','PERSONAL','PLANNING','POWERFUL','PROTOCOL','QUESTION','RADIATED','REACTORS','RECOVERY','REGISTER','RESEARCH','RESOURCE','RESPONSE','SECURITY','SENTIENT','SHELTERS','SOFTWARE','SURVIVAL','TERMINAL','TRAINING','TRANSFER','TRAVELER','UNLOCKED','VALUABLE','WASTELAND','WILDLIFE']};
let audioContext=null,soundOn=true;
function tone(freq=600,duration=.07,type='square',volume=.045,delay=0){
 if(!soundOn)return;
 try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();
 const t=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,volume),t+.007);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+duration+.01);
 }catch(e){}
}
function sfx(which){
 if(which==='key'){tone(520,.035,'square',.018);tone(180,.024,'triangle',.018,.018)}
 if(which==='deny'){tone(330,.16,'sawtooth',.055);tone(220,.19,'sawtooth',.04,.18)}
 if(which==='win'){[440,554,659,880].forEach((f,i)=>tone(f,.14,'sine',.055,i*.11))}
 if(which==='lock'){[400,300,200,130].forEach((f,i)=>tone(f,.18,'sawtooth',.06,i*.16))}
 if(which==='bracket'){tone(720,.07,'sine',.055);tone(960,.11,'sine',.055,.09)}
 if(which==='boot'){tone(110,.1,'triangle',.04);tone(240,.09,'triangle',.04,.12)}
}
let answer,attempts,done,words,used,brackets,logLines;const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)];function newGame(){sfx('boot');const n=Number($('difficulty').value);let pool=[...new Set(bank[n].filter(x=>x.length===n))];pool.sort(()=>Math.random()-.5);words=pool.slice(0,Math.min(12,pool.length));answer=pick(words);attempts=4;done=false;used=new Set();brackets=new Set();logLines=['> INITIALIZING PASSWORD INTERFACE','> SELECT A PASSWORD CANDIDATE'];render()}function render(){ $('status').textContent=done?(attempts>0?'ACCESS GRANTED':'TERMINAL LOCKED'):'PASSWORD REQUIRED';$('attempts').textContent='ATTEMPTS REMAINING: '+('■ '.repeat(attempts))+'□ '.repeat(4-attempts);const g=$('grid');g.replaceChildren();const symbols='!@#$%^&*-+=?/;:.,';for(let i=0;i<words.length;i++){const line=document.createElement('div');line.className='line';const pre=document.createTextNode('0x'+(0xF000+i*12).toString(16).toUpperCase()+' '+Array.from({length:3},()=>pick([...symbols])).join(''));line.append(pre);const btn=document.createElement('button');btn.className='token';btn.textContent=used.has(words[i])?'·'.repeat(words[i].length):words[i];btn.disabled=done||used.has(words[i]);btn.onclick=()=>guess(words[i]);line.append(btn);const pair=['()','[]','{}','<>'][i%4];const bracket=document.createElement('button');bracket.className='token';bracket.textContent=brackets.has(i)?'..':pair; bracket.disabled=done||brackets.has(i);bracket.title='Bracket trick';bracket.onclick=()=>bracketAction(i);line.append(document.createTextNode(pick([...symbols])),bracket);g.append(line)}$('log').textContent=logLines.slice(-14).join('\n')}function write(...lines){logLines.push(...lines);render()}function guess(word){if(done)return;sfx('key');used.add(word);const likeness=[...word].filter((c,i)=>c===answer[i]).length;if(word===answer){sfx('win');done=true;write('> '+word,'> EXACT MATCH','> ACCESS GRANTED');return}attempts--;sfx(attempts===0?'lock':'deny');if(attempts===0)done=true;write('> '+word,'> ENTRY DENIED','> LIKENESS = '+likeness+'/'+answer.length,...(done?['> TERMINAL LOCKED']:[]))}function bracketAction(i){if(done)return;sfx('bracket');brackets.add(i);const remaining=words.filter(w=>w!==answer&&!used.has(w));if(attempts<4&&Math.random()<.5){attempts=4;write('> BRACKET MATCH','> ATTEMPTS RESET')}else if(remaining.length){const dud=pick(remaining);used.add(dud);write('> BRACKET MATCH','> DUD REMOVED: '+dud)}else{attempts=4;write('> BRACKET MATCH','> ATTEMPTS RESET')} }$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='SOUND: '+(soundOn?'ON':'OFF');$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)sfx('key')};$('reset').onclick=newGame;$('difficulty').onchange=newGame;$('hint').onclick=()=>write('> WORDS: SELECT A CANDIDATE','> LIKENESS = MATCHING LETTERS IN SAME POSITION','> BRACKETS: REMOVE A FALSE WORD OR RESET ATTEMPTS','> FOUR FAILED GUESSES LOCK THE TERMINAL');newGame();
</script></body></html>
